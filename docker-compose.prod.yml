services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/o/.well-known/openid-configuration', timeout=5); sys.exit(0)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - static_data:/srv/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  sqlite_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
